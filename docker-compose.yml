services:
  db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [booking-net]

  rooms-service:
    build: ./rooms-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/rooms
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [booking-net]

  users-service:
    build: ./users-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/users
      DB_USER: postgres
      DB_PASSWORD: postgres
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks: [booking-net]

  bookings-service:
    build: ./bookings-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookings
      DB_USER: postgres
      DB_PASSWORD: postgres
      ROOMS_URL: http://rooms-service:8080
      USERS_URL: http://users-service:8080
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      rooms-service:
        condition: service_started
      users-service:
        condition: service_started
    ports:
      - "8083:8080"
    networks: [booking-net]

volumes:
  db_data:

networks:
  booking-net:
